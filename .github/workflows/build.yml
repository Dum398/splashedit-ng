name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # psxsplash.ps-exe is MIPS code, identical on every OS, so it is built once
  # and shipped in each package: the PCdrv build Play boots, the CD-ROM build
  # (psxsplash-cdrom.ps-exe) Export puts on a disc, and the PCdrv builds with
  # Build > Performance / Room Debug Overlay on: psxsplash-perf (FPS counter
  # and heap bar), psxsplash-rooms (room wireframe) and psxsplash-perf-rooms.
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: psxsplash/psxsplash
          submodules: recursive
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mipsel-linux-gnu
      - name: Build
        run: |
          # make clean deletes every *.ps-exe, so park each build outside the tree.
          make -j4 LOADER=cdrom PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips
          mv psxsplash.ps-exe ../psxsplash-cdrom
          make clean
          make -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips FPSOVERLAY=1 MEMOVERLAY=1
          mv psxsplash.ps-exe ../psxsplash-perf
          make clean
          make -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips ROOMDEBUG=1
          mv psxsplash.ps-exe ../psxsplash-rooms
          make clean
          make -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips FPSOVERLAY=1 MEMOVERLAY=1 ROOMDEBUG=1
          mv psxsplash.ps-exe ../psxsplash-perf-rooms
          make clean
          make -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips
          for v in cdrom perf rooms perf-rooms; do mv ../psxsplash-$v psxsplash-$v.ps-exe; done
          for v in "" -cdrom -perf -rooms -perf-rooms; do test -f psxsplash$v.ps-exe; done
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            psxsplash.ps-exe
            psxsplash-cdrom.ps-exe
            psxsplash-perf.ps-exe
            psxsplash-rooms.ps-exe
            psxsplash-perf-rooms.ps-exe

  build:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            xvfb xauth libgl1-mesa-dri desktop-file-utils
      # SDL3 and FreeType are always built in, so the package never links a
      # library the target machine lacks (Homebrew's FreeType on macOS).
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        shell: bash
        run: |
          cli=build/cli/splashpack-cli
          [ -f build/cli/Release/splashpack-cli.exe ] && cli=build/cli/Release/splashpack-cli.exe
          py=python3; command -v python3 >/dev/null || py=python
          "$py" tests/roundtrip.py "$cli"
          "$py" tests/luacheck.py "$cli"
          "$py" tests/blockscheck.py "$cli"
          "$py" tests/audiocheck.py "$cli"
          "$py" tests/uicheck.py "$cli"
          "$py" tests/cutscenecheck.py "$cli"
          "$py" tests/skincheck.py "$cli"
          "$py" tests/animcheck.py "$cli"
          "$py" tests/lightcheck.py "$cli"
          "$py" tests/interactcheck.py "$cli"
          "$py" tests/memcardcheck.py "$cli"
          "$py" tests/importcheck.py "$cli"
          "$py" tests/blendcheck.py "$cli"
          "$py" tests/disccheck.py "$cli"
          "$py" tests/bvhstatscheck.py "$cli"
          "$py" tests/navstatscheck.py "$cli"
          "$py" tests/splashdiffcheck.py "$cli"
          "$py" tests/iconcheck.py
      - name: Editor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Game view keys
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" sh tests/gamekeys.sh build/splashedit build/emulator_tests
      - name: Script editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/scripteditorcheck.py build/splashedit
      - name: Copy, cut and paste
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/clipboardcheck.py build/splashedit
      - name: Export from the editor matches the CLI
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/exportflipcheck.py build/splashedit build/cli/splashpack-cli
      - name: Memory card settings
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/memcardeditcheck.py build/splashedit
      - name: Timeline
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelinecheck.py build/splashedit
      - name: Timeline preview
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelinepreviewcheck.py build/splashedit
      - name: Paste offset
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/pasteoffsetcheck.py build/splashedit
      - name: Import warnings
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/importwarningscheck.py build/splashedit
      - name: .blend import in the background
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/blendasynccheck.py build/splashedit
      - name: Timeline edits
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelineeditcheck.py build/splashedit
      - name: Project panel
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/assetbrowsercheck.py build/splashedit
      - name: Model import in the background
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/asyncimportcheck.py build/splashedit
      - name: Timeline selections and events
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelineselectcheck.py build/splashedit
      - name: Timeline key and event row
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelinekeyrowcheck.py build/splashedit
      - name: Scene fog, GTE scaling and scene type
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/scenefogcheck.py build/splashedit
      - name: Scene loading screen
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/loadingscreencheck.py build/splashedit
      - name: Build scenes list
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/buildscenescheck.py build/splashedit
      - name: Build problems
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/buildproblemscheck.py build/splashedit
      - name: VRAM layout
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/vramlayoutcheck.py build/splashedit
      - name: Disc settings
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/discsettingscheck.py build/splashedit
      - name: Debug overlays
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/overlaycheck.py build/splashedit
      - name: Centre panel tabs
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/scripttabscheck.py build/splashedit
      - name: Block editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/blockseditorcheck.py build/splashedit
      - name: New blocks and New Lua, block help
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/newscriptcheck.py build/splashedit
      - name: Component fields in the object inspector
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/compfieldscheck.py build/splashedit
      - name: Room and Portal components in the editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/roomscheck.py build/splashedit
      - name: BVH preview in the editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/bvhcheck.py build/splashedit
      - name: Nav region inspection in the editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/navinspectcheck.py build/splashedit
      - name: Play output filter, copy and clear
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/consolecheck.py build/splashedit
      - name: Run on hardware output filter, copy and clear
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/hwconsolecheck.py build/splashedit
      - name: Inspector mesh colour and audio source info
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/inspectorinfocheck.py build/splashedit
      - name: Inspector per-material texture and colour
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/materialscheck.py build/splashedit
      - name: Inspector skinned mesh bones, clips and sizes
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/skininfocheck.py build/splashedit
      - name: Object inspector scrolls
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/inspectorscrollcheck.py build/splashedit
      - name: Viewport trigger, interact and nav overlays
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/gizmocheck.py build/splashedit
      - name: UI canvas editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/uicanvascheck.py build/splashedit
      - name: UI scene fonts
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/uifontscheck.py build/splashedit
      - name: UI canvas header at a small window
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/uicanvassmallcheck.py build/splashedit
      - name: UI image texture preview
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/uitexpreviewcheck.py build/splashedit
      # One download: the editor with its assets, the example project, the
      # engine and the latest pcsx-redux dev build for this OS.
      - uses: actions/download-artifact@v4
        with:
          name: engine
          path: pkg/engine
      - name: Package
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Windows) project=dev-win-x64 ;;
            macOS) project=dev-macos-arm ;;
            *) project=dev-linux-x64 ;;
          esac
          base=https://distrib.app/storage/manifests/pcsx-redux/$project
          id=$(curl -fsSL "$base/manifest.json" | jq '[.builds[].id] | max')
          path=$(curl -fsSL "$base/manifest-$id.json" | jq -r .path)
          curl -fsSL -o "redux-download" "https://distrib.app$path"
          mkdir -p pkg/redux pkg/examples
          case "${{ runner.os }}" in
            Windows)
              (cd pkg/redux && cmake -E tar xf ../../redux-download)
              cp build/Release/splashedit.exe pkg/
              # The editor and redux both import the MSVC runtime, which a
              # clean Windows does not have: ship it app-local beside each.
              for d in msvcp140 msvcp140_atomic_wait vcruntime140 vcruntime140_1; do
                cp "C:/Windows/System32/$d.dll" pkg/
                cp "C:/Windows/System32/$d.dll" pkg/redux/
              done ;;
            macOS)
              mnt=$(mktemp -d)
              hdiutil attach -nobrowse -readonly -mountpoint "$mnt" redux-download
              cp -R "$mnt/PCSX-Redux.app" pkg/redux/
              hdiutil detach "$mnt"
              cp build/splashedit pkg/ ;;
            *)
              # Unpacked, because running an AppImage needs libfuse2, which
              # recent distributions no longer install.
              (cd pkg/redux && cmake -E tar xf ../../redux-download && chmod +x PCSX-Redux-*.AppImage &&
                ./PCSX-Redux-*.AppImage --appimage-extract >/dev/null && rm PCSX-Redux-*.AppImage &&
                mv squashfs-root pcsx-redux.AppDir && ln -s pcsx-redux.AppDir/AppRun pcsx-redux)
              cp build/splashedit pkg/
              # A menu entry and icons, added to the user's menu by install-desktop-entry.sh.
              mkdir -p pkg/share/applications
              cp packaging/linux/splashedit.desktop pkg/share/applications/
              cp packaging/linux/install-desktop-entry.sh pkg/
              for n in 16 32 64 128 256 512; do
                mkdir -p pkg/share/icons/hicolor/${n}x${n}/apps
                cp assets/brand/icon-$n.png pkg/share/icons/hicolor/${n}x${n}/apps/splashedit.png
              done ;;
          esac
          cp -R assets pkg/
          cp -R examples/courtyard pkg/examples/
          ls pkg pkg/engine pkg/redux
          test -f pkg/engine/psxsplash.ps-exe
          test -f pkg/engine/psxsplash-cdrom.ps-exe
          test -f pkg/engine/psxsplash-perf.ps-exe
          test -f pkg/engine/psxsplash-rooms.ps-exe
          test -f pkg/engine/psxsplash-perf-rooms.ps-exe
          test -f pkg/redux/pcsx-redux.exe || test -f pkg/redux/pcsx-redux || test -d pkg/redux/PCSX-Redux.app
          # Nothing outside the OS may be linked in.
          case "${{ runner.os }}" in
            Windows) test -f pkg/vcruntime140.dll && test -f pkg/redux/msvcp140.dll ;;
            macOS) otool -L pkg/splashedit; ! otool -L pkg/splashedit | grep -E '/opt/homebrew|/usr/local' ;;
            *) test -x pkg/redux/pcsx-redux && ! ldd pkg/redux/pcsx-redux.AppDir/usr/bin/pcsx-redux | grep 'not found' ;;
          esac
          # On macOS the editor and everything it ships go into SplashEdit.app,
          # whose Resources folder is where the editor looks for them.
          if [ "${{ runner.os }}" = macOS ]; then
            app=pkg/SplashEdit.app/Contents
            mkdir -p "$app/MacOS" "$app/Resources"
            mv pkg/splashedit "$app/MacOS/"
            mv pkg/assets pkg/examples pkg/engine pkg/redux "$app/Resources/"
            cp packaging/macos/Info.plist "$app/"
            cp assets/brand/icon.icns "$app/Resources/SplashEdit.icns"
          fi
          py=python3; command -v python3 >/dev/null || py=python
          "$py" tests/packagecheck.py pkg
          # upload-artifact drops the executable bit, so Linux and macOS ship a tarball.
          mv pkg splashedit
          if [ "${{ runner.os }}" = Windows ]; then
            cmake -E tar cf splashedit-windows.zip --format=zip splashedit
          else
            tar czf "splashedit-$(echo ${{ runner.os }} | tr A-Z a-z).tar.gz" splashedit
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: splashedit-${{ runner.os }}
          path: splashedit-*.*

  # The packages as downloads anyone can take without a GitHub login: every
  # push to main replaces the "nightly" prerelease, a v* tag makes a release.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: splashedit-*
          merge-multiple: true
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if [ "${{ github.ref_type }}" = tag ]; then
            gh release create "${{ github.ref_name }}" dist/* --verify-tag --title "${{ github.ref_name }}" --notes-file docs/release-notes.md
          else
            gh release delete nightly --cleanup-tag --yes || true
            gh release create nightly dist/* --prerelease --target "${{ github.sha }}" \
              --title "Nightly ($(git log -1 --format=%h))" --notes-file docs/release-notes.md
          fi
