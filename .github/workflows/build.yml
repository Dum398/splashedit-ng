      - name: Model import in the background
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/asyncimportcheck.py build/splashedit
      - name: Timeline selections and events
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelineselectcheck.py build/splashedit
      - name: Timeline key and event row
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelinekeyrowcheck.py build/splashedit
      - name: Scene fog, GTE scaling and scene type
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/scenefogcheck.py build/splashedit
      - name: Scene edge fade switch
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/edgefadecheck.py build/splashedit
      - name: Scene loading screen
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/loadingscreencheck.py build/splashedit
      - name: Build scenes list
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/buildscenescheck.py build/splashedit
      - name: New project templates
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/newprojectcheck.py build/splashedit
      - name: Unity project import
