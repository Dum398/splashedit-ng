name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  # psxsplash.ps-exe is MIPS code, identical on every OS, so it is built once
  # and shipped in each package: the PCdrv build Play boots, the CD-ROM build
  # (psxsplash-cdrom.ps-exe) Export puts on a disc, and the PCdrv builds with
  # Build > Performance / Room Debug Overlay on: psxsplash-perf (FPS counter
  # and heap bar), psxsplash-rooms (room wireframe) and psxsplash-perf-rooms.
  # Each also comes as <name>-nologo.ps-exe, built without the boot logo (every
  # feature in the engine Makefile's ALL_FEATURES but bootlogo): Play and Run on
  # hardware boot those with Build > Boot Logo in Test Runs off, and Export puts
  # psxsplash-cdrom-nologo on the disc when the project's Boot logo is Off.
  engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: psxsplash/psxsplash
          submodules: recursive
      # The editor compiles Lua on the host and every engine here is NOPARSER, so the psxlua
      # CMakeLists.txt pins must be the one this psxsplash's nugget records, or the shipped
      # engines would misread the editor's bytecode while tests/luacheck.py stays green.
      - uses: actions/checkout@v4
        with:
          path: editor
          sparse-checkout: |
            CMakeLists.txt
            tools/psxluapin.sh
          sparse-checkout-cone-mode: false
      - name: psxlua pin matches the engine's
        run: bash editor/tools/psxluapin.sh . editor/CMakeLists.txt
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mipsel-linux-gnu
      - name: Build
        run: |
          # make clean deletes every *.ps-exe, so park each build outside the tree.
          out=$(mktemp -d)
          # The -nologo builds: every feature the Makefile knows but bootlogo.
          NOLOGO=$(sed -n 's/^ALL_FEATURES = //p' Makefile | tr ' ' '\n' | grep -vx bootlogo | paste -sd,)
          echo "features without the boot logo: $NOLOGO"
          case ",$NOLOGO," in ,, | *,bootlogo,*) echo "bad feature list"; exit 1 ;; esac
          # Every engine is a NOPARSER=1 build: SplashEdit always exports Lua compiled, so the Lua
          # parser would only cost RAM (28 KB of static image). make clean also deletes psxlua's
          # liblua-noparser.a, which the engine's Makefile does not rebuild, so each variant makes it.
          mk() {
            make clean
            make -C third_party/nugget/third_party/psxlua psx-noparser PREFIX=mipsel-linux-gnu
            make -j4 PREFIX=mipsel-linux-gnu FORMAT=elf32-tradlittlemips NOPARSER=1 "$@"
            # psxlua's parser stub: there only when the parser was left out.
            grep -q "parser not loaded" psxsplash.ps-exe || { echo "not a NOPARSER build: $*"; exit 1; }
          }
          for logo in "" -nologo; do
            if [ -n "$logo" ]; then set -- "FEATURES=$NOLOGO"; else set --; fi
            mk LOADER=cdrom "$@"
            mv psxsplash.ps-exe "$out/psxsplash-cdrom$logo"
            mk FPSOVERLAY=1 MEMOVERLAY=1 "$@"
            mv psxsplash.ps-exe "$out/psxsplash-perf$logo"
            mk ROOMDEBUG=1 "$@"
            mv psxsplash.ps-exe "$out/psxsplash-rooms$logo"
            mk FPSOVERLAY=1 MEMOVERLAY=1 ROOMDEBUG=1 "$@"
            mv psxsplash.ps-exe "$out/psxsplash-perf-rooms$logo"
            mk "$@"
            mv psxsplash.ps-exe "$out/psxsplash$logo"
          done
          for v in "" -cdrom -perf -rooms -perf-rooms; do
            for logo in "" -nologo; do
              mv "$out/psxsplash$v$logo" psxsplash$v$logo.ps-exe
              test -f psxsplash$v$logo.ps-exe
            done
          done
          # The two must differ: a -nologo build that kept the logo would be the same bytes.
          if cmp -s psxsplash.ps-exe psxsplash-nologo.ps-exe; then echo "the -nologo build is the logo build"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            psxsplash.ps-exe
            psxsplash-cdrom.ps-exe
            psxsplash-perf.ps-exe
            psxsplash-rooms.ps-exe
            psxsplash-perf-rooms.ps-exe
            psxsplash-nologo.ps-exe
            psxsplash-cdrom-nologo.ps-exe
            psxsplash-perf-nologo.ps-exe
            psxsplash-rooms-nologo.ps-exe
            psxsplash-perf-rooms-nologo.ps-exe

  build:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev \
            xvfb xauth libgl1-mesa-dri desktop-file-utils
      # SDL3 and FreeType are always built in, so the package never links a
      # library the target machine lacks (Homebrew's FreeType on macOS).
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_DISABLE_FIND_PACKAGE_SDL3=ON -DCMAKE_DISABLE_FIND_PACKAGE_Freetype=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      # The sample games pinned in templates/samples.lock, so the checks
      # below (and New Project's) see them as the package ships them.
      - name: Fetch samples
        shell: bash
        run: bash tools/fetch-samples.sh templates
      - name: Test
        shell: bash
        run: |
          cli=build/cli/splashpack-cli
          [ -f build/cli/Release/splashpack-cli.exe ] && cli=build/cli/Release/splashpack-cli.exe
          py=python3; command -v python3 >/dev/null || py=python
          "$py" tests/roundtrip.py "$cli"
          "$py" tests/luacheck.py "$cli"
          "$py" tests/blockscheck.py "$cli"
          "$py" tests/audiocheck.py "$cli"
          "$py" tests/audioformatcheck.py "$cli"
          "$py" tests/uicheck.py "$cli"
          "$py" tests/stringscheck.py "$cli"
          "$py" tests/cutscenecheck.py "$cli"
          "$py" tests/skincheck.py "$cli"
          "$py" tests/animcheck.py "$cli"
          "$py" tests/multiclipcheck.py "$cli"
          "$py" tests/lightcheck.py "$cli"
          "$py" tests/interactcheck.py "$cli"
          "$py" tests/agentcheck.py "$cli"
          "$py" tests/memcardcheck.py "$cli"
          "$py" tests/spritecheck.py "$cli"
          "$py" tests/uispritecheck.py "$cli"
          "$py" tests/importcheck.py "$cli"
          "$py" tests/unityimportcheck.py "$cli"
          "$py" tests/renderbufferscheck.py "$cli"
          "$py" tests/blendcheck.py "$cli"
          "$py" tests/disccheck.py "$cli"
          "$py" tests/cddacheck.py "$cli"
          "$py" tests/templatecheck.py "$cli"
          "$py" tests/samplecheck.py "$cli"
          "$py" tests/bvhstatscheck.py "$cli"
          "$py" tests/navstatscheck.py "$cli"
          "$py" tests/splashdiffcheck.py "$cli"
          "$py" tests/fogmaskcheck.py "$cli"
          "$py" tests/iconcheck.py
          "$py" tests/luadefscheck.py
      - name: Editor tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Game view keys
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" sh tests/gamekeys.sh build/splashedit build/emulator_tests
      - name: Restart button
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" sh tests/restartcheck.sh build/splashedit build/emulator_tests
      - name: Script editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/scripteditorcheck.py build/splashedit
      - name: Tab in the script editor
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/luatabcheck.py build/splashedit
      - name: External editor setup (lua-language-server)
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/luadefsguicheck.py build/splashedit
      - name: Copy, cut and paste
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/clipboardcheck.py build/splashedit
      - name: Copy and paste a colour field
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/colourclipcheck.py build/splashedit
      - name: Export from the editor matches the CLI
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/exportflipcheck.py build/splashedit build/cli/splashpack-cli
      - name: Memory card settings
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/memcardeditcheck.py build/splashedit
      - name: Sprite sheets
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/spritesheetcheck.py build/splashedit
      - name: Sprite direction sets
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/dirsetcheck.py build/splashedit
      - name: Prefabs
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/prefabcheck.py build/splashedit
      - name: HUD sprites in the UI tab
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/uispriteguicheck.py build/splashedit
      - name: Tilemap
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/tilemapcheck.py build/splashedit
      - name: Tilemap tools
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/tilemap2check.py build/splashedit
      - name: Timeline
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelinecheck.py build/splashedit
      - name: Timeline preview
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/timelinepreviewcheck.py build/splashedit
      - name: Frame debugger
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/framedebugcheck.py build/splashedit
      - name: Paste offset
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/pasteoffsetcheck.py build/splashedit
      - name: Import warnings
