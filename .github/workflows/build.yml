        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/bootlogocheck.py build/splashedit build/emulator_tests
      - name: Centre panel tabs
        if: runner.os == 'Linux'
        run: LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1600x960x24" python3 tests/scripttabscheck.py build/splashedit
      - name: Block editor
        if: runner.os == 'Linux'
